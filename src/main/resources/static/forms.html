<!DOCTYPE html>
<html>
    <head>
        <title>Forms</title>
    </head>
    <body>
    <h2>Credit Application Form</h2>
    <form action="/submit" method="post">
        <label for="name">Applicant Name</label>
        <input type="text" name="name" id="name">
        <br><br>

        <label for="email">Email Adress</label>
        <input type="email" name="email" id="email">
        <br><br>

        <label for="loanAmount">Loan Amount</label>
        <input type="number" name="loanAmount" id="loanAmount">
        <br><br>

        <!--RADIO BUTTONS-->
        <label>Loan Type: </label>
        <input type="radio" id="personal" name="loanType" value="personal">
        <label for="personal">Loan Amount</label>
        <input type="radio" id="home" name="loanType" value="home">
        <label for="home">Home Amount</label>
        <input type="radio" id="auto" name="loanType" value="auto">
        <label for="auto">Auto Amount</label>
        <br><br>

        <!--Dropdown List-->
        <label>Loan Duration: </label>
        <select name=loanDuration required>
            <option value="">Select Duration</option>
            <option value="1year">1 Year</option>
            <option value="2years">2 Years</option>
            <option value="5years">5 Year</option>
            <option value="10years">10 Year</option>
        </select>
        <br><br>

        <!--Checkbox-->
        <label>Additional: </label>
        <input type="checkbox" id="insurance" name="features" value="insurance">
        <label for="insurance">Insurance</label>
        <input type="checkbox" id="flexiblePayment" name="features" value="flexiblePayment">
        <label for="flexiblePayment">Flexible Payment</label>
        <input type="checkbox" id="cashBack" name="features" value="cashBack">
        <label for="cashBack">CashBack</label>
        <br><br>

        <!--File Upload-->
        <label for="documents">Documents: </label>
        <input type="file" name="documents" id="documents" accept=".pdf, .doc, .docx" >
        <br><br>

        <!--Button-->
        <button type="submit">Submit Application</button>
        <br><br>
    </form>

    </body>
</html>
