<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Library Management System</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>

    <body class="bg-light d-flex align-items-center justify-content-center vh-100">
        <div class="card shadow p-5 text-center" style="max-width: 450px; width: 100%;">
            <h1 class="mb-3">Library App</h1>
            <p class="text-muted mb-4">Welcome! Please log in or register to explore our library</p>
            <div>
                <a th:href="@{/login}" class="btn btn-primary btn-lg">Log in</a>
                <a th:href="@{/register}" class="btn btn-outline-secondary btn-lg">Register</a>
            </div>
        </div>
    </body>

</html>
