<!Doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>User Registration</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    </head>

    <body  class="register-page d-flex align-items-center justify-content-center vh-100">
        <div class="card register-card shadow p-4">
            <div class="card-body">
            <h2 class="card-title text-center mb-1">Register user</h2>
                <form th:action="@{/register}" th:object="${user}" method="post" class="register-form">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" placeholder="you@example.com" required />
                        <br/><br/>

                        <label class="form-label">Password</label>
                        <input type="password" th:field="*{password}" class="form-control" placeholder="Choose a secure password"  required />
                        <br/><br/>
                    </div>

                    <div class="d-grid mb-2">
                        <button type="submit" class="btn btn-primary">Register</button>
                    </div>

                </form>
            </div>
        </div>
    </body>

</html>
