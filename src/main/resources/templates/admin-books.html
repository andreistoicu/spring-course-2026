<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

<div class="container">

    <!-- Page Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 fw-bold mb-0">📚 Admin Dashboard - Manage Books</h2>
        <a th:href="@{/}" class="btn btn-outline-secondary btn-sm">&larr; Back to Catalog</a>
    </div>

    <!-- Add / Edit Form Card -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-dark text-white py-3">
            <h3 class="h5 mb-0" th:text="${newBook.id == null} ? '📝 Add New Book' : '📝 Edit Book'">📝 Add / Edit Book</h3>
        </div>
        <div class="card-body p-4">
            <form th:action="@{/admin/books/save}" th:object="${newBook}" method="post">
                <input type="hidden" th:field="*{id}" />
                <input type="hidden" th:field="*{version}" />

                <div class="row g-3">
                    <!-- Title -->
                    <div class="col-md-6">
                        <label for="title" class="form-label fw-semibold">Title:</label>
                        <input type="text" id="title" class="form-control" th:field="*{title}" placeholder="Enter book title" required />
                    </div>

                    <!-- Author -->
                    <div class="col-md-6">
                        <label for="title" class="form-label fw-semibold">Author:</label>
                        <input type="text" id="author" class="form-control" th:field="*{author}" placeholder="Enter author name" required />
                    </div>

                    <!-- Publication Year -->
                    <div class="col-md-6">
                        <label for="publicationYear" class="form-label fw-semibold">Publication Year:</label>
                        <input type="number" id="publicationYear" class="form-control" th:field="*{publicationYear}" placeholder="e.g. 1954" required />
                    </div>

                    <!-- Total Copies -->
                    <div class="col-md-6">
                        <label for="totalCopies" class="form-label fw-semibold">Total Copies:</label>
                        <input type="number" id="totalCopies" class="form-control" th:field="*{totalCopies}" min="1" placeholder="e.g. 5" required />
                    </div>
                </div>

                <div class="mt-4 text-end">
                    <button type="submit" class="btn btn-success px-4">
                        💾 Save Book
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Book List Table Card -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h3 class="h5 mb-0 fw-bold">📖 Book List</h3>
        </div>
        <div class="card-body p-0">

            <!-- Empty State -->
            <div th:if="${books.isEmpty()}" class="text-center text-muted py-5">
                <p class="mb-0 fs-5">No books available. Add your first book above!</p>
            </div>

            <!-- Table -->
            <div th:if="${not books.isEmpty()}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light border-bottom">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th class="text-center">Year</th>
                        <th class="text-center">Total</th>
                        <th class="text-center">Available</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${books}">
                        <td class="ps-4 text-muted" th:text="${book.id}">1</td>
                        <td class="fw-bold" th:text="${book.title}">Title</td>
                        <td th:text="${book.author?.name}">Author Name</td>
                        <td class="text-center" th:text="${book.publicationYear}">2024</td>
                        <td class="text-center" th:text="${book.totalCopies}">10</td>
                        <td class="text-center">
                                <span class="badge"
                                      th:classappend="${book.availableCopies > 0} ? 'bg-success' : 'bg-danger'"
                                      th:text="${book.availableCopies}">
                                    0
                                </span>
                        </td>
                        <td class="text-end pe-4">
                            <a th:href="@{/admin/books/delete/{id}(id=${book.id})}"
                               onclick="return confirm('Are you sure you want to delete this book?')"
                               class="btn btn-sm btn-outline-danger">
                                🗑️ Delete
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
