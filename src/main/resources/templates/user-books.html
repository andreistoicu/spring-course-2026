<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User - Search & Borrow books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light py-5">

<div class="container">
    <div class="card shadow-sm border-0">

        <!-- Header -->
        <div class="card-header bg-primary text-white py-3">
            <h2 class="h4 mb-0 text-center">User Catalog for Books</h2>
        </div>

        <div class="card-body p-4">

            <!-- Search Bar -->
            <form th:action="@{/user/books/search}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text"
                           name="query"
                           th:value="${query}"
                           class="form-control"
                           placeholder="Search books by title or author..." />
                    <button type="submit" class="btn btn-primary">
                        Search
                    </button>
                </div>
            </form>

            <!-- Books Table -->
            <div class="table-responsive">
                <table class="table table-hover align-middle border">
                    <thead class="table-dark">
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th class="text-center">Publication Year</th>
                        <th class="text-center">Total Copies</th>
                        <th class="text-center">Available Copies</th>
                        <th class="text-center">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Empty State -->
                    <tr th:if="${#lists.isEmpty(books)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            No books found in the catalog.
                        </td>
                    </tr>

                    <!-- Books List -->
                    <tr th:each="book : ${books}">
                        <td class="fw-bold" th:text="${book.title}">Title</td>
                        <td th:text="${book.author != null ? book.author.name : 'N/A'}">Author Name</td>
                        <td class="text-center" th:text="${book.publicationYear}">2024</td>
                        <td class="text-center" th:text="${book.totalCopies}">10</td>
                        <td class="text-center">
                                <span class="badge"
                                      th:classappend="${book.availableCopies > 0} ? 'bg-success' : 'bg-danger'"
                                      th:text="${book.availableCopies}">
                                    0
                                </span>
                        </td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <!-- Borrow Action -->
                                <form th:action="@{/user/books/borrow/{id}(id=${book.id})}" method="post">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-primary"
                                            th:disabled="${book.availableCopies <= 0}">
                                        Borrow
                                    </button>
                                </form>

                                <!-- Return Action -->
                                <form th:action="@{/user/books/return/{id}(id=${book.id})}" method="post">
                                    <button type="submit" class="btn btn-sm btn-outline-warning">
                                        Return
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

</body>
</html>
