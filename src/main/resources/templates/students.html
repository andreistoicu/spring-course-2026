<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Students</title>
    </head>
    <body>
        <h1>Students list</h1>
        <table>

            <tr>
                <th>Name</th>
                <th>Age</th>
            </tr>

            <tr th:each="student : ${students}">
                <td th:text="${student.name}" ></td>
                <td th:text="${student.age}" ></td>
            </tr>

        </table>
    </body>
</html>
