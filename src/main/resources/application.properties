spring.application.name=spring-boot-library-app

server.port=8080

#thymeleaf
spring.thymeleaf.cache=false

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./src/main/resources/testdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (optional - for web-based database management)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create
#spring.jpa.hibernate.ddl-auto=create -> use when you want to reset de DB
#ne arata query-urile
spring.jpa.show-sql=true

#ne arata atributele in clar in query-uri
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

